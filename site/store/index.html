<head>

<style>
:root{
  --teal:#17564A; --teal-d:#0F3B33; --tape:#F4C21F;
  --paper:#F3F5EE; --panel:#FFFFFF; --ink:#10211C; --muted:#41554E; --line:#B8C8BF;
  --link:#0F4A3F; --edge:#10211C; --shadow:#10211C; --pic:#E6ECE6;
  --f-stencil:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;
  --f-text:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;     /* خط القراءة: للأسماء والعناوين والأسعار */
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#0B1613; --panel:#1C3B33; --ink:#F4F8F5; --muted:#C3D4CC; --line:#4A7569;
  --link:#F4C21F; --edge:#8FC2B3; --shadow:#04100C; --pic:#14292A;
} }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:18px;line-height:1.8;word-spacing:.08em}
a{color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px;border-radius:4px}
.wrap{width:min(960px,100% - 32px);margin-inline:auto}
.top{background:var(--teal-d);color:#F4F8F5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{font-family:var(--f-stencil);font-weight:800;font-size:1.55rem;letter-spacing:.12em;text-decoration:none;direction:ltr}
.top .back{font-size:1rem;text-decoration:none;border:2px solid #8FC2B3;border-radius:999px;padding:5px 16px}
.door{background:var(--teal);color:#F4F8F5;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,rgba(0,0,0,0) 3px 26px)}
.door::before,.door::after{content:"";display:block;height:14px;background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,#10211C 16px 32px)}
.door .in{padding-block:clamp(32px,7vw,64px)}
.tag{background:var(--panel);color:var(--ink);max-width:640px;padding:clamp(20px,4vw,32px);border:3px solid var(--edge);box-shadow:8px 8px 0 var(--shadow)}
.tag h1{font-family:var(--f-text);font-weight:700;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.35;margin:0 0 10px;word-spacing:.18em}
.tag p{margin:0;font-size:1.1rem;color:var(--ink)}
main{padding-block:26px 36px}
[hidden]{display:none!important}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px;font-size:1.05rem}
.crumbs a{color:var(--link);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:0;font:inherit}
.crumbs b{font-weight:700}
.crumbs .sep{color:var(--muted)}
.methods{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px}
.methods .lb{color:var(--muted);font-size:1rem}
.chip{font:inherit;font-weight:700;font-size:1rem;border:2px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tape);color:#10211C;border-color:#10211C}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--edge);border-radius:14px;overflow:hidden;text-align:center;font:inherit;color:var(--ink);padding:0;box-shadow:5px 5px 0 var(--shadow)}
button.card{cursor:pointer}
button.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.card .pic{aspect-ratio:1/1;background:var(--pic);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:12px 10px 14px;border-top:3px solid var(--edge)}
.card .nm{font-family:var(--f-text);font-weight:700;font-size:1.12rem;line-height:1.45;color:var(--ink);word-break:break-word}
.card .pr{margin-top:8px;display:inline-block;background:var(--tape);color:#10211C;font-weight:700;font-size:1.05rem;border-radius:999px;padding:3px 14px;direction:ltr}
.card .pr small{display:block;font-weight:600;font-size:.82rem;color:#10211C}
.card .soon{display:block;margin-top:8px;color:var(--muted);font-size:.9rem}
.state,.empty{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px;color:var(--ink);text-align:center;font-size:1.05rem}
.state button{margin-top:12px;font:inherit;font-weight:700;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:8px 20px;cursor:pointer}
.skel{height:170px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));opacity:.5}
footer{padding-block:24px;color:var(--muted);font-size:1rem}
.tools{display:flex;align-items:center;gap:10px}
.menu{font:inherit;font-size:1.35rem;line-height:1;border:2px solid #8FC2B3;background:transparent;color:#F4F8F5;border-radius:10px;padding:6px 13px;cursor:pointer}
body.lock{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(340px,88vw);background:var(--panel);color:var(--ink);border-inline-end:3px solid var(--edge);z-index:50;display:flex;flex-direction:column;overflow:auto}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--edge)}
.dr-head h2{margin:0;font-size:1.3rem}
.dr-close{font:inherit;font-size:1.1rem;border:2px solid var(--edge);background:transparent;color:var(--ink);border-radius:10px;padding:4px 12px;cursor:pointer}
#drBody{padding:16px}
#drBody p{margin:0 0 14px}
.hint{color:var(--muted);font-size:.95rem}
.btn-main{display:block;width:100%;font:inherit;font-weight:700;font-size:1.05rem;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:11px 16px;cursor:pointer;margin-bottom:12px}
.btn-ghost{display:block;width:100%;font:inherit;font-weight:700;border:2px solid var(--edge);background:transparent;color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer;margin-top:16px}
.who{margin-bottom:14px}
.who .n2{font-weight:700;font-size:1.2rem;word-break:break-word}
.who .em{color:var(--muted);font-size:.95rem;word-break:break-all}
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.vipbadge{background:var(--tape);color:#10211C;font-weight:700;border-radius:999px;padding:2px 14px}
.track{height:14px;border:2px solid var(--edge);border-radius:8px;background:var(--pic);overflow:hidden;margin:6px 0 6px}
.fill{height:100%;background:var(--tape)}
.prog{color:var(--ink);font-size:.98rem;line-height:1.6}
.mnote{border:2px dashed var(--edge);border-radius:10px;padding:10px 12px;margin:2px 0 12px;font-size:.98rem;line-height:1.7}
.cta{border:3px dashed var(--edge);border-radius:14px;padding:18px 16px;background:var(--panel);text-align:center;margin-block:10px 4px}
.cta h2{margin:0 0 6px;font-size:1.25rem}
.cta p{margin:0 0 12px}
.cta-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:10px}
.cta-btn{display:inline-block;min-width:140px;font:inherit;font-weight:700;font-size:1.05rem;text-align:center;text-decoration:none;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:10px 18px}
.msg{min-height:1.4em;margin-top:6px;font-size:.98rem;color:var(--ink)}
.msg.err{color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;background:var(--pic)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">YARDOVA</a>
    <div class="tools">

</header>

    <div class="cta-btns">
      <a class="cta-btn" id="ctaTg" href="https://t.me/IBRAHEEM932" target="_blank" rel="noopener noreferrer">✈️ تلغرام</a>
      <a class="cta-btn" id="ctaWa" href="https://wa.me/963932867131" target="_blank" rel="noopener noreferrer">💬 واتساب</a>

<footer class="wrap">© Yardova</footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" hidden>
  <div class="dr-head"><h2 id="drTitle">حسابي</h2><button class="dr-close" id="btnCloseDrawer" type="button" aria-label="إغلاق">✕</button></div>
  <div id="drBody"></div>
</aside>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// متجر الشدات (الخطوة 2): بيعرض الشجرة اللي بنيتها بالأدمن (أقسام بصور ← منتجات بأسعارها). بدون طلبات بعد.
const API = 'https://postback.ly-ad.de';
let TREE = null, METHODS = [], METHOD = null;       // METHOD: طريقة الدفع المختارة (null = دولار بس)
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs || {})){ if(k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  kids.forEach(x => e.append(x)); return e;
}
const roundTo = (x, d) => Math.round(Number((x * Math.pow(10, d)).toPrecision(12))) / Math.pow(10, d);   // toPrecision: حتى ما يطلع 1.01 بدل 1.02 بسبب كسور الفاصلة
const fmtUsd = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
// السعر بعملة طريقة الدفع: بالدولار × سعر الصرف × (1 + النسبة الإضافية)
function priceIn(m, usd){ const d = Number(m.decimals); return roundTo(Number(usd) * Number(m.rate) * (1 + (Number(m.feePct) || 0) / 100), d).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' ' + m.currency; }
function priceBox(usd){
  const box = el('span', { class: 'pr' });
  if(METHOD){ box.append(document.createTextNode(priceIn(METHOD, usd)), el('small', { text: fmtUsd(usd) })); } else box.textContent = fmtUsd(usd);
  return box;
}
function imgSrc(u){ return typeof u === 'string' && /^\/store\/img\/[A-Za-z0-9_-]+(\?v=\d+)?$/.test(u) ? API + u : ''; }   // بس صور من سيرفرنا
function findPath(nodes, id, trail){
  for(const n of nodes){
    if(n.id === id) return [...trail, n];
    if(n.children){ const r = findPath(n.children, id, [...trail, n]); if(r) return r; }
  }
  return null;
}
function pic(n, icon){
  const box = el('div', { class: 'pic' });
  const src = imgSrc(n.imageUrl);
  if(src){ const im = el('img', { src, alt: '', loading: 'lazy' }); im.onerror = () => { box.textContent = icon; }; box.append(im); } else box.textContent = icon;
  return box;
}
function folderCard(n){
  const b = el('button', { class: 'card', type: 'button', 'data-go': n.id, 'aria-label': n.name }, pic(n, '📁'), el('div', { class: 'body' }, el('div', { class: 'nm', text: n.name })));
  return b;
}
function itemCard(n){
  return el('div', { class: 'card', 'data-item': n.id }, pic(n, '🎮'), el('div', { class: 'body' }, el('div', { class: 'nm', text: n.name }), priceBox(n.priceUsd), el('span', { class: 'soon', text: 'الطلب قريباً' })));
}
function savedMethod(){ try{ return localStorage.getItem('store_method') || ''; }catch(e){ return ''; } }
function renderMethods(){
  const bar = $('methods'); bar.textContent = '';
  bar.hidden = !METHODS.length; if(!METHODS.length) return;
  bar.append(el('span', { class: 'lb', text: 'الدفع عبر:' }));
  METHODS.forEach(m => { const c = el('button', { class: 'chip', type: 'button', 'data-m': m.id, 'aria-pressed': METHOD && METHOD.id === m.id ? 'true' : 'false', text: m.name }); bar.append(c); });
}
function render(){
  const box = $('catalog'), cr = $('crumbs'); box.textContent = ''; cr.textContent = '';
  if(TREE === null) return;
  renderMethods();
  const id = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
  let trail = id ? findPath(TREE, id, []) : [];
  let note = '';
  if(id && !trail){ trail = []; note = 'هالقسم مو موجود.'; }
  const cur = trail.length ? trail[trail.length - 1] : null;
  if(cur && cur.type === 'item') trail = trail.slice(0, -1);
  const nodes = cur && cur.type === 'folder' ? cur.children : (trail.length ? trail[trail.length - 1].children : TREE);
  cr.append(trail.length ? el('a', { href: '#', text: 'الرئيسية' }) : el('b', { text: 'الرئيسية' }));
  trail.forEach((n, i) => { cr.append(el('span', { class: 'sep', text: '›' })); cr.append(i === trail.length - 1 ? el('b', { text: n.name }) : el('a', { href: '#/' + encodeURIComponent(n.id), text: n.name })); });
  document.title = (trail.length ? trail[trail.length - 1].name + ' | ' : '') + 'متجر الشدات | Yardova';
  if(note) box.append(el('div', { class: 'state', id: 'noteMsg', text: note }));
  if(!nodes || !nodes.length){ box.append(el('div', { class: 'empty', id: 'emptyNote', text: 'ما في منتجات هلق.' })); return; }
  const grid = el('div', { class: 'grid' });
  nodes.forEach(n => grid.append(n.type === 'folder' ? folderCard(n) : itemCard(n)));
  box.append(grid);
}
async function load(){
  const box = $('catalog'); box.textContent = '';
  const g = el('div', { class: 'grid', id: 'loading' }); for(let i = 0; i < 4; i++) g.append(el('div', { class: 'skel' })); box.append(g);
  try{
    const res = await fetch(API + '/store/catalog'); const j = await res.json();
    if(!res.ok || !j.ok || !Array.isArray(j.items)) throw new Error('bad');
    TREE = j.items; METHODS = Array.isArray(j.methods) ? j.methods.filter(m => m && m.id && m.currency && Number(m.rate) > 0) : [];
    METHOD = METHODS.find(m => m.id === savedMethod()) || METHODS[0] || null;          // أول طريقة افتراضياً، وبنتذكّر اختيار الزبون
    render();
  }catch(e){
    box.textContent = '';
    const st = el('div', { class: 'state', id: 'errState' }, el('div', { text: 'تعذّر تحميل المتجر. تأكد من الإنترنت وجرّب كمان مرة.' }), el('button', { id: 'btnRetry', type: 'button', text: 'إعادة المحاولة' }));
    box.append(st); $('btnRetry').onclick = load;
  }
}
$('methods').addEventListener('click', e => {
  const c = e.target.closest('[data-m]'); if(!c) return; METHOD = METHODS.find(m => m.id === c.dataset.m) || METHOD;
  try{ localStorage.setItem('store_method', METHOD.id); }catch(err){}
  render();
});
$('catalog').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if(b){ location.hash = '#/' + encodeURIComponent(b.dataset.go); window.scrollTo(0, 0); } });
window.addEventListener('hashchange', render);
load();
// ===== الحساب: لوحة جانبية (دخول Google). الحساب بيتعمل أول مرة بيدخل فيها =====
let auth = null, USER = null, CUSTOMER = null, ACC = 'idle', ACC_MSG = '';       // ACC: idle | loading | ok | error
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp({ apiKey: 'AIzaSyAP7sXXQeNCmdgwqUo6meC2Uv6_zM7jxwA', authDomain: 'warehouse-tycoon-a3f83.firebaseapp.com', projectId: 'warehouse-tycoon-a3f83', appId: '1:1054454384493:web:3003d8c766739e75e33c64' });
    auth = firebase.auth();
  }
}catch(e){ auth = null; }
function authMsg(err){
  const c = err && err.code;
  if(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return 'سكّرت نافذة الدخول قبل ما تكمّل. جرّب كمان مرة.';
  if(c === 'auth/popup-blocked') return 'المتصفح منع نافذة الدخول. اسمح بالنوافذ المنبثقة وجرّب كمان مرة.';
  if(c === 'auth/network-request-failed') return 'ما في اتصال بالإنترنت.';
  return 'تعذّر الدخول. جرّب كمان مرة.';
}
function renderDrawer(){
  renderCta();
  const b = $('drBody'); b.textContent = '';
  if(!auth){ b.append(el('div', { class: 'msg err', id: 'accMsg', text: 'تعذّر تحميل تسجيل الدخول. حدّث الصفحة وجرّب كمان مرة.' })); return; }
  if(!USER){
    b.append(el('p', { text: 'سجّل دخول عشان تتابع حسابك ومستوى VIP تبعك.' }), el('button', { class: 'btn-main', id: 'btnGoogle', type: 'button', text: 'الدخول بحساب Google' }), el('p', { class: 'hint', text: 'إذا ما عندك حساب، بيتعمل لك أول ما تدخل.' }), el('div', { class: 'msg' + (ACC_MSG ? ' err' : ''), id: 'accMsg', role: 'alert', text: ACC_MSG }));
    return;
  }
  if(ACC === 'loading' || ACC === 'idle'){ b.append(el('p', { id: 'accLoading', text: 'عم نحمّل حسابك...' })); return; }
  if(ACC === 'error'){
    b.append(el('div', { class: 'msg err', id: 'accMsg', role: 'alert', text: 'تعذّر تحميل حسابك. جرّب كمان مرة.' }), el('button', { class: 'btn-main', id: 'btnRetryAcc', type: 'button', text: 'إعادة المحاولة' }), el('button', { class: 'btn-ghost', id: 'btnLogout', type: 'button', text: 'تسجيل الخروج' }));
    return;
  }
  const c = CUSTOMER;
  b.append(
    el('div', { class: 'who' }, el('div', { class: 'n2', id: 'accName', text: c.name }), el('div', { class: 'em', id: 'accEmail', dir: 'ltr', text: c.email })),
    el('div', { class: 'acc-row' }, el('span', { text: 'مستوى VIP' }), el('span', { class: 'vipbadge', id: 'accVip', text: 'VIP ' + c.vip })),
    progBox(c),
    merchantNote(c),
    el('div', { class: 'acc-row' }, el('span', { text: 'إجمالي الصرف' }), el('b', { id: 'accSpent', dir: 'ltr', text: fmtUsd(c.spentUsd) })),
    el('button', { class: 'btn-ghost', id: 'btnMerchant', type: 'button', text: '🏪 هل أنت تاجر؟ تواصل معنا' }),
    el('button', { class: 'btn-ghost', id: 'btnLogout', type: 'button', text: 'تسجيل الخروج' })
  );
}
function merchantNote(c){
  const m = c.merchant; if(!m) return document.createTextNode('');
  const dm = ms => new Date(ms).toLocaleDateString('en-GB');
  if(m.status === 'locked') return el('div', { class: 'mnote', id: 'accMerchant', text: '🏪 حسابك تاجر مثبّت على VIP ' + m.level + '.' });
  return el('div', { class: 'mnote', id: 'accMerchant', text: '🏪 فترة اختبار للتاجر (VIP ' + m.level + '): صرفك ' + fmtUsd(m.windowSpentUsd) + ' من ' + fmtUsd(m.targetUsd) + ' · باقي ' + fmtUsd(m.remainingUsd) + ' قبل ' + dm(m.endsAt) + ' (باقي ' + m.daysLeft + ' يوم).' });
}
function progBox(c){
  const max = c.sizeUsd === null || c.sizeUsd === undefined, pct = max ? 100 : Math.max(0, Math.min(100, c.progressUsd / c.sizeUsd * 100));
  const fill = el('div', { class: 'fill', id: 'accFill' }); fill.style.width = pct.toFixed(1) + '%';
  return el('div', { class: 'accprog', style: 'padding:6px 0 12px;' }, el('div', { class: 'track', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-valuenow': String(Math.round(pct)), 'aria-label': 'تقدّمك للمستوى الجاي' }, fill),
    el('div', { class: 'prog', id: 'accProg', text: max ? 'وصلت لأعلى مستوى 🎉' : ('تقدّمك ' + fmtUsd(c.progressUsd) + ' من ' + fmtUsd(c.sizeUsd) + ' · باقي ' + fmtUsd(c.remainingUsd) + ' للوصول لـVIP ' + c.nextVip) }));
}
async function loadCustomer(){
  ACC = 'loading'; renderDrawer();
  try{
    const token = await USER.getIdToken();
    const res = await fetch(API + '/store/me', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: '{}' });
    const j = await res.json(); if(!res.ok || !j.ok || !j.customer) throw new Error('bad');
    CUSTOMER = j.customer; ACC = 'ok';
  }catch(e){ ACC = 'error'; }
  renderDrawer();
}
function openDrawer(){
  renderDrawer();
  $('drawer').hidden = false; $('scrim').hidden = false; document.body.classList.add('lock'); $('btnMenu').setAttribute('aria-expanded', 'true');
  $('btnCloseDrawer').focus();
}
function closeDrawer(){
  $('drawer').hidden = true; $('scrim').hidden = true; document.body.classList.remove('lock'); $('btnMenu').setAttribute('aria-expanded', 'false');
  $('btnMenu').focus();      // دايماً لزر القائمة (بعض الجوالات ما بتعطي الزر تركيز عند اللمس)
}
$('btnMenu').addEventListener('click', openDrawer);
$('btnCloseDrawer').addEventListener('click', closeDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => {
  if($('drawer').hidden) return;
  if(e.key === 'Escape'){ closeDrawer(); return; }
  if(e.key === 'Tab'){                                   // بنبقي التنقل بالـTab جوّا اللوحة
    const f = [...$('drawer').querySelectorAll('button')].filter(x => !x.disabled); if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
$('drBody').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.id === 'btnGoogle'){
    ACC_MSG = ''; b.disabled = true;
    try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(err){ ACC_MSG = authMsg(err); renderDrawer(); }
  } else if(b.id === 'btnMerchant'){ closeDrawer(); $('merchantCta').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('ctaTg').focus(); }
  else if(b.id === 'btnLogout'){ try{ await auth.signOut(); }catch(err){} }
  else if(b.id === 'btnRetryAcc'){ loadCustomer(); }
});


// ===== زر التاجر: بيفتح تلغرام/واتساب برسالة جاهزة، ومعها معرّف حسابه وإيميله إذا مسجّل دخول =====
const CONTACT = { tg: 'IBRAHEEM932', wa: '963932867131' };
function ctaMessage(){
  const lines = ['مرحباً، أنا تاجر وبدي أسعار الجملة بمتجر ياردوفا.'];
  if(USER && ACC === 'ok' && CUSTOMER){ lines.push('معرّف حسابي: ' + CUSTOMER.id); if(CUSTOMER.email) lines.push('الإيميل: ' + CUSTOMER.email); }
  lines.push('صرفي الشهري المتوقع بالدولار: ');
  return lines.join('\n');
}
function renderCta(){
  const t = encodeURIComponent(ctaMessage());
  $('ctaTg').href = 'https://t.me/' + CONTACT.tg + '?text=' + t;
  $('ctaWa').href = 'https://wa.me/' + CONTACT.wa + '?text=' + t;
  $('ctaHint').hidden = !!(USER && ACC === 'ok' && CUSTOMER);
}
renderCta();
if(auth) auth.onAuthStateChanged(u => { USER = u; CUSTOMER = null; ACC_MSG = ''; ACC = 'idle'; if(u) loadCustomer(); else renderDrawer(); });

</script>
