<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yardova Card</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F3B33">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#17564A; --teal-d:#0F3B33; --tape:#F4C21F;
  --paper:#F3F5EE; --panel:#FFFFFF; --ink:#10211C; --muted:#41554E; --line:#B8C8BF;
  --link:#0F4A3F; --edge:#10211C; --shadow:#10211C; --pic:#E6ECE6;
  --f-stencil:"Big Shoulders Stencil Display",Impact,"Arial Narrow",sans-serif;
  --f-text:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;     /* خط القراءة: للأسماء والعناوين والأسعار */
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#0B1613; --panel:#1C3B33; --ink:#F4F8F5; --muted:#C3D4CC; --line:#4A7569;
  --link:#F4C21F; --edge:#8FC2B3; --shadow:#04100C; --pic:#14292A;
} }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-text);font-size:18px;line-height:1.8;word-spacing:.08em}
a{color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:3px;border-radius:4px}
.wrap{width:min(960px,100% - 32px);margin-inline:auto}
.top{background:var(--teal-d);color:#F4F8F5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{font-family:var(--f-stencil);font-weight:800;font-size:1.55rem;letter-spacing:.12em;text-decoration:none;direction:ltr}
.top .back{font-size:1rem;text-decoration:none;border:2px solid #8FC2B3;border-radius:999px;padding:5px 16px}
.door{background:var(--teal);color:#F4F8F5;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,rgba(0,0,0,0) 3px 26px)}
.door::before,.door::after{content:"";display:block;height:14px;background:repeating-linear-gradient(-45deg,var(--tape) 0 16px,#10211C 16px 32px)}
.door .in{padding-block:clamp(32px,7vw,64px)}
.tag{background:var(--panel);color:var(--ink);max-width:640px;padding:clamp(20px,4vw,32px);border:3px solid var(--edge);box-shadow:8px 8px 0 var(--shadow)}
.tag h1{font-family:var(--f-stencil);font-weight:800;letter-spacing:.06em;font-size:clamp(1.9rem,7vw,2.7rem);line-height:1.2;margin:0 0 10px;text-align:start}
.tag p{margin:0;font-size:1.1rem;color:var(--ink)}
main{padding-block:26px 36px}
[hidden]{display:none!important}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px;font-size:1.05rem}
.crumbs a{color:var(--link);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:0;font:inherit}
.crumbs b{font-weight:700}
.crumbs .sep{color:var(--muted)}
.methods{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 20px}
.methods .lb{color:var(--muted);font-size:1rem}
.chip{font:inherit;font-weight:700;font-size:1rem;border:2px solid var(--edge);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tape);color:#10211C;border-color:#10211C}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--edge);border-radius:14px;overflow:hidden;text-align:center;font:inherit;color:var(--ink);padding:0;box-shadow:5px 5px 0 var(--shadow)}
button.card{cursor:pointer}
button.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.card .pic{aspect-ratio:1/1;display:flex;flex-direction:row;direction:ltr;align-items:stretch;gap:8px;overflow:hidden;padding:10px;background:radial-gradient(120% 120% at 30% 20%,#1F7A68 0%,var(--teal) 45%,var(--teal-d) 100%)}
.card .pic .art{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;font-size:3rem}
.card .pic img{width:100%;height:100%;object-fit:contain;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35);display:block}
.card .pic .brand{flex:0 0 22px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-family:var(--f-stencil);font-weight:800;font-size:.72rem;letter-spacing:.16em;line-height:1;border-radius:8px;background:rgba(5,16,12,.55);color:#F4F8F5;text-transform:uppercase;pointer-events:none}
.card .body{padding:12px 10px 14px;border-top:3px solid var(--edge)}
.card .nm{font-family:var(--f-text);font-weight:700;font-size:1.12rem;line-height:1.45;color:var(--ink);word-break:break-word}
.card .pr{margin-top:8px;display:inline-block;background:var(--tape);color:#10211C;font-weight:700;font-size:1.05rem;border-radius:999px;padding:3px 14px;direction:ltr}
.card .pr small{display:block;font-weight:600;font-size:.82rem;color:#10211C}
.card .soon{display:block;margin-top:8px;color:var(--muted);font-size:.9rem}
.state,.empty{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:28px;color:var(--ink);text-align:center;font-size:1.05rem}
.state button{margin-top:12px;font:inherit;font-weight:700;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:8px 20px;cursor:pointer}
.skel{height:170px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));opacity:.5}
footer{padding-block:24px;color:var(--muted);font-size:1rem}
footer a,.hint a{color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.tools{display:flex;align-items:center;gap:10px}
.menu{font:inherit;font-size:1.35rem;line-height:1;border:2px solid #8FC2B3;background:transparent;color:#F4F8F5;border-radius:10px;padding:6px 13px;cursor:pointer}
body.lock{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(340px,88vw);background:var(--panel);color:var(--ink);border-inline-end:3px solid var(--edge);z-index:50;display:flex;flex-direction:column;overflow:auto}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--edge)}
.dr-head h2{margin:0;font-size:1.3rem}
.dr-close{font:inherit;font-size:1.1rem;border:2px solid var(--edge);background:transparent;color:var(--ink);border-radius:10px;padding:4px 12px;cursor:pointer}
#drBody{padding:16px}
#drBody p{margin:0 0 14px}
.hint{color:var(--muted);font-size:.95rem}
.btn-main{display:block;width:100%;font:inherit;font-weight:700;font-size:1.05rem;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:11px 16px;cursor:pointer;margin-bottom:12px}
.btn-ghost{display:block;width:100%;font:inherit;font-weight:700;border:2px solid var(--edge);background:transparent;color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer;margin-top:16px}
.who{margin-bottom:14px}
.who .n2{font-weight:700;font-size:1.2rem;word-break:break-word}
.who .em{color:var(--muted);font-size:.95rem;word-break:break-all}
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.vipbadge{background:var(--tape);color:#10211C;font-weight:700;border-radius:999px;padding:2px 14px}
.track{height:14px;border:2px solid var(--edge);border-radius:8px;background:var(--pic);overflow:hidden;margin:6px 0 6px}
.fill{height:100%;background:var(--tape)}
.prog{color:var(--ink);font-size:.98rem;line-height:1.6}
.mnote{border:2px dashed var(--edge);border-radius:10px;padding:10px 12px;margin:2px 0 12px;font-size:.98rem;line-height:1.7}
.wallet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 10px;padding:0 0 8px;border-bottom:2px solid var(--line);font-size:.9rem;line-height:1.5}
.wallet .bal{display:flex;align-items:baseline;gap:6px;flex:1 1 auto;min-width:0;white-space:nowrap}
.wallet .bal .lb{color:var(--muted)}
.wallet .bal b{font-size:1.05rem;direction:ltr;display:inline-block}
.wallet .bal small{color:var(--muted);font-size:.85rem;direction:ltr}
.wallet .bal small::before{content:"· "}
.wallet .cta-btn{min-width:0;padding:2px 10px;font-size:.85rem;border-width:2px;border-radius:8px}
.seg{display:flex;gap:4px;margin-inline-start:auto}
.seg .chip{padding:1px 10px;font-size:.85rem;border-width:2px}
.order-btn{display:block;width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:1rem;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:8px 10px;cursor:pointer}
.vipnote{display:block;font-size:.78rem;font-weight:700;color:#10211C}
.scrim2{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:55}
.osheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.os-in{pointer-events:auto;background:var(--panel);color:var(--ink);border:3px solid var(--edge);border-radius:16px 16px 0 0;width:min(560px,100%);max-height:92vh;overflow:auto}
#osBody{padding:14px 16px 22px}
#osBody label.f{display:block;margin:14px 0 4px;font-weight:700}
#osBody input.tx{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink)}
#osBody .opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
#osBody .sum{border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.8}
#osBody .big{font-size:1.5rem;font-weight:700;direction:ltr;text-align:center;margin:8px 0}
#osBody .accbox{direction:ltr;text-align:start;background:var(--paper);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;margin:6px 0;word-break:break-all;font-weight:700}
#osBody .warn{border:2px solid var(--edge);border-radius:10px;padding:8px 10px;margin:10px 0;background:var(--pic);font-size:.95rem;line-height:1.7}
#osBody .dellist{margin:8px 0;padding-inline-start:22px;line-height:1.9}
.stat{display:inline-block;background:var(--tape);color:#10211C;font-weight:700;border-radius:999px;padding:1px 14px}
#osBody img.pv{max-width:100%;max-height:200px;border:2px solid var(--edge);border-radius:8px;margin-top:6px;display:block}
.myrow{display:block;width:100%;text-align:start;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;cursor:pointer}
.myrow .a{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.myrow .b{color:var(--muted);font-size:.9rem}
.cta{border:3px dashed var(--edge);border-radius:14px;padding:18px 16px;background:var(--panel);text-align:center;margin-block:10px 4px}
.cta h2{margin:0 0 6px;font-size:1.25rem}
.cta p{margin:0 0 12px}
.cta-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:10px}
.cta-btn{display:inline-block;min-width:140px;font:inherit;font-weight:700;font-size:1.05rem;text-align:center;text-decoration:none;border:3px solid #10211C;background:var(--tape);color:#10211C;border-radius:10px;padding:10px 18px}
.idcheck:not(:empty){border:2px solid var(--edge);border-radius:8px;padding:6px 10px;margin:8px 0;background:var(--pic);font-weight:700;line-height:1.7}
.msg{min-height:1.4em;margin-top:6px;font-size:.98rem;color:var(--ink)}
.msg.err{color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;background:var(--pic)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">YARDOVA</a>
    <div class="tools">
      <a class="back" href="/">← رجوع للموقع</a>
      <button class="menu" id="btnMenu" type="button" aria-label="حسابي" aria-expanded="false" aria-controls="drawer"><span aria-hidden="true">☰</span></button>

</header>

<main class="wrap" id="app">
  <nav class="crumbs" id="crumbs" aria-label="المسار"></nav>
  <div id="catalog" aria-live="polite"></div>
</main>
<section class="wrap" id="merchantCta" aria-labelledby="mcTitle">
  <div class="cta">
    <h2 id="mcTitle">هل أنت تاجر؟ تواصل معنا</h2>
    <p>بدك أسعار الجملة؟ تواصل معنا وبننقل حسابك لمستوى VIP أعلى حسب حجم صرفك الشهري.</p>
    <div class="cta-btns">
      <a class="cta-btn" id="ctaTg" href="https://t.me/IBRAHEEM932" target="_blank" rel="noopener noreferrer">✈️ تلغرام</a>
      <a class="cta-btn" id="ctaWa" href="https://wa.me/963932867131" target="_blank" rel="noopener noreferrer">💬 واتساب</a>
    </div>
    <p class="hint" id="ctaHint">للأفضل سجّل دخول أول (من ☰) حتى نعرف حسابك بسرعة.</p>
  </div>
</section>
<footer class="wrap">© Yardova · <a href="/store/terms/">الشروط</a> · <a href="/store/privacy/">الخصوصية</a></footer>
<div class="scrim" id="scrim" hidden></div>
<div class="scrim2" id="scrim2" hidden></div>
<div class="osheet" id="osheet" role="dialog" aria-modal="true" aria-labelledby="osTitle" hidden>
  <div class="os-in">
    <div class="dr-head"><h2 id="osTitle"></h2><button class="dr-close" id="osClose" type="button" aria-label="إغلاق">✕</button></div>
    <div id="osBody"></div>
  </div>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" hidden>
  <div class="dr-head"><h2 id="drTitle">حسابي</h2><button class="dr-close" id="btnCloseDrawer" type="button" aria-label="إغلاق">✕</button></div>
  <div id="drBody"></div>
</aside>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// متجر الشدات (الخطوة 2): بيعرض الشجرة اللي بنيتها بالأدمن (أقسام بصور ← منتجات بأسعارها). بدون طلبات بعد.
const API = 'https://postback.ly-ad.de';
let TREE = null;
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for(const k in (attrs || {})){ if(k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  kids.forEach(x => e.append(x)); return e;
}
const roundTo = (x, d) => Math.round(Number((x * Math.pow(10, d)).toPrecision(12))) / Math.pow(10, d);   // toPrecision: حتى ما يطلع 1.01 بدل 1.02 بسبب كسور الفاصلة
const fmtUsd = n => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
let PRICES = null, PRICE_VIP = 1;                                  // أسعار المنتجات بمستوى الزبون المسجّل (من السيرفر)
function priceBox(usd){
  const box = el('span', { class: 'pr' }); box.append(document.createTextNode(money(usd)), el('small', { text: moneyAlt(usd) }));
  return box;
}
function imgSrc(u){ return typeof u === 'string' && /^\/store\/img\/[A-Za-z0-9_-]+(\?v=\d+)?$/.test(u) ? API + u : ''; }   // بس صور من سيرفرنا
function findPath(nodes, id, trail){
  for(const n of nodes){
    if(n.id === id) return [...trail, n];
    if(n.children){ const r = findPath(n.children, id, [...trail, n]); if(r) return r; }
  }
  return null;
}
function pic(n, icon){
  const box = el('div', { class: 'pic' }), art = el('div', { class: 'art' });
  const src = imgSrc(n.imageUrl);
  if(src){ const im = el('img', { src, alt: '', loading: 'lazy' }); im.onerror = () => { art.textContent = icon; }; art.append(im); } else art.textContent = icon;
  box.append(art, el('span', { class: 'brand', 'aria-hidden': 'true', text: 'Yardova Card' }));          // الإطار: بيتحط تلقائياً على كل صورة
  return box;
}
function folderCard(n){
  const b = el('button', { class: 'card', type: 'button', 'data-go': n.id, 'aria-label': n.name }, pic(n, '📁'), el('div', { class: 'body' }, el('div', { class: 'nm', text: n.name })));
  return b;
}
function itemCard(n){
  const mine = PRICES && PRICES[n.id] !== undefined ? PRICES[n.id] : n.priceUsd, pb = priceBox(mine);
  if(PRICES && mine !== n.priceUsd) pb.append(el('span', { class: 'vipnote', text: 'سعرك VIP ' + PRICE_VIP }));
  return el('div', { class: 'card', 'data-item': n.id }, pic(n, '🎮'), el('div', { class: 'body' }, el('div', { class: 'nm', text: n.name }), pb, el('button', { class: 'order-btn', type: 'button', 'data-order': n.id, text: 'اطلب' })));
}
function render(){
  const box = $('catalog'), cr = $('crumbs'); box.textContent = ''; cr.textContent = '';
  if(TREE === null) return;
  renderWallet();
  const id = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
  let trail = id ? findPath(TREE, id, []) : [];
  let note = '';
  if(id && !trail){ trail = []; note = 'هالقسم مو موجود.'; }
  const cur = trail.length ? trail[trail.length - 1] : null;
  if(cur && cur.type === 'item') trail = trail.slice(0, -1);
  const nodes = cur && cur.type === 'folder' ? cur.children : (trail.length ? trail[trail.length - 1].children : TREE);
  cr.append(trail.length ? el('a', { href: '#', text: 'الرئيسية' }) : el('b', { text: 'الرئيسية' }));
  trail.forEach((n, i) => { cr.append(el('span', { class: 'sep', text: '›' })); cr.append(i === trail.length - 1 ? el('b', { text: n.name }) : el('a', { href: '#/' + encodeURIComponent(n.id), text: n.name })); });
  document.title = (trail.length ? trail[trail.length - 1].name + ' | ' : '') + 'Yardova Card';
  if(note) box.append(el('div', { class: 'state', id: 'noteMsg', text: note }));
  if(!nodes || !nodes.length){ box.append(el('div', { class: 'empty', id: 'emptyNote', text: 'ما في منتجات هلق.' })); return; }
  const grid = el('div', { class: 'grid' });
  nodes.forEach(n => grid.append(n.type === 'folder' ? folderCard(n) : itemCard(n)));
  box.append(grid);
}
async function load(){
  const box = $('catalog'); box.textContent = '';
  const g = el('div', { class: 'grid', id: 'loading' }); for(let i = 0; i < 4; i++) g.append(el('div', { class: 'skel' })); box.append(g);
  try{
    const res = await fetch(API + '/store/catalog'); const j = await res.json();
    if(!res.ok || !j.ok || !Array.isArray(j.items)) throw new Error('bad');
    TREE = j.items; if(j.wallet && Number(j.wallet.pointsPerUsd) > 0) WALLET.pointsPerUsd = Number(j.wallet.pointsPerUsd);
    render();
  }catch(e){
    box.textContent = '';
    const st = el('div', { class: 'state', id: 'errState' }, el('div', { text: 'تعذّر تحميل المتجر. تأكد من الإنترنت وجرّب كمان مرة.' }), el('button', { id: 'btnRetry', type: 'button', text: 'إعادة المحاولة' }));
    box.append(st); $('btnRetry').onclick = load;
  }
}
$('catalog').addEventListener('click', e => {
  const ob = e.target.closest('[data-order]'); if(ob){ openOrder(ob.dataset.order); return; } const b = e.target.closest('[data-go]'); if(b){ location.hash = '#/' + encodeURIComponent(b.dataset.go); window.scrollTo(0, 0); } });
window.addEventListener('hashchange', render);
load();
// ===== الحساب: لوحة جانبية (دخول Google). الحساب بيتعمل أول مرة بيدخل فيها =====
let auth = null, USER = null, CUSTOMER = null, ACC = 'idle', ACC_MSG = '';       // ACC: idle | loading | ok | error

async function receiptToDataUrl(file){

  for(const max of [1000, 800, 600, 400]){
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    for(const q of [0.8, 0.6, 0.45]){ let url = cv.toDataURL('image/webp', q); if(!/^data:image\/webp/.test(url)) url = cv.toDataURL('image/png'); if(url.length <= 200000) return url; }
  }
  throw new Error('الصورة كبيرة كتير حتى بعد التصغير، جرّب صورة تانية.');
}

$('osBody').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.preset){ SH.amt = b.dataset.preset; const i = $('tqAmount'); if(i) i.value = SH.amt; updateTopupPts(); clearTimeout(tqTimer); loadTopupQuote(); return; }
  if(b.dataset.mid){ SH.methodId = b.dataset.mid; if(SH.step === 'tform') renderTopupDynamic(); else renderSheet(); return; }
  if(b.id === 'osDone'){ closeSheet(); return; }
  if(b.dataset.copy !== undefined){ const okc = await copyText(b.dataset.copy); b.textContent = okc ? '✅ تم النسخ' : 'انسخ يدوياً'; return; }
  if(b.id === 'osImgDel'){ SH.img = undefined; renderSheet(); return; }
  if(b.id === 'osTopup'){ openTopup(QUOTE ? QUOTE.shortUsd : 0); return; }
  if(b.id === 'osDelFinish'){ try{ await auth.signOut(); }catch(err){} closeSheet(); return; }
  if(b.id === 'osCancelClose'){ SH.msg = ''; const r = await cancelClosing(); if(r === null) return; if(r){ SH.msg = r; renderSheet(); return; } ORD = { ...ORD, status: 'cancelled' }; renderSheet(); return; }
  if(b.id === 'osDelGo'){
    SH.msg = ''; const hasBal = Number(SH.del.balanceUsd) >= 0.01, method = SH.dm.trim(), acct = SH.da.trim();
    if(hasBal && (method.length < 2 || acct.length < 3)){ SH.msg = 'اكتب طريقة استلام رصيدك وحسابك.'; renderSheet(); return; }
    if(!SH.dc){ SH.msg = 'أكّد إنك فاهم إنه الحذف نهائي.'; renderSheet(); return; }
    SH.busy = true; renderSheet();
    try{
      const j = await apiAuth('/store/deleteMe', { op: 'request', confirm: true, reqId: SH.rid, payoutMethod: method, payoutAccount: acct });
      SH.busy = false;
      if(j.deleted){ SH.step = 'ddone'; renderSheet(); $('osDelFinish').focus(); return; }
      ORD = j.request; DEL_MSG = ''; SH.step = 'pay'; renderSheet(); loadCustomer(); loadMyOrders(); $('osClose').focus();
    }catch(err){ SH.busy = false; SH.msg = err.message; renderSheet(); }
    return;
  }
  if(b.id === 'osSubmit'){
    const pid = SH.pid.trim(); SH.msg = ''; SH.ok = '';
    if(pid.length < 3 || pid.length > 40 || !/^[\p{L}\p{N}_#@.\- ]+$/u.test(pid)){ SH.msg = 'اكتب معرّف اللاعب (Player ID) بشكل صحيح: 3 لـ40 خانة، أرقام وأحرف.'; renderSheet(); $('osPid').focus(); return; }
    clearTimeout(idTimer);
    if(SH.idSupported !== false && (!SH.idRes || SH.idRes.pid !== pid || SH.idRes.state === 'checking')){ b.disabled = true; await checkPlayerId(); b.disabled = false; }
    if(SH.idRes && SH.idRes.pid === pid && SH.idRes.state === 'invalid'){ SH.msg = 'ما لقينا حساب بهالـID. تأكد منه وجرّب كمان مرة.'; renderSheet(); $('osPid').focus(); return; }
    SH.busy = true; renderSheet();
    try{
      const j = await apiAuth('/store/order', { itemId: SH.item.id, playerId: pid, reqId: SH.rid }); ORD = j.order;
      if(CUSTOMER && typeof j.balanceUsd === 'number') CUSTOMER.balanceUsd = j.balanceUsd;
      SH.step = 'pay'; SH.busy = false; renderSheet(); renderWallet(); renderDrawer(); loadMyOrders(); $('osClose').focus();
    }catch(err){
      SH.busy = false;
      if(err.code === 'insufficient_balance' && err.data){ QUOTE = { ...QUOTE, balanceUsd: Number(err.data.balanceUsd), enough: false, shortUsd: Number(err.data.shortUsd) }; if(CUSTOMER) CUSTOMER.balanceUsd = Number(err.data.balanceUsd); renderWallet(); }
      SH.msg = err.message; renderSheet();
    }
    return;
  }
  if(b.id === 'tqSubmit'){
    SH.msg = ''; const a = Number(SH.amt); if(!SH.methodId){ SH.msg = 'اختار طريقة دفع.'; renderTopupDynamic(); return; }
    SH.busy = true; renderTopupDynamic();
    try{ const j = await apiAuth('/store/topup', { amountUsd: a, methodId: SH.methodId, reqId: SH.rid }); ORD = j.order; SH.step = 'pay'; SH.busy = false; renderSheet(); startTimer(); loadMyOrders(); $('osClose').focus(); }
    catch(err){ SH.busy = false; SH.msg = err.message; renderTopupDynamic(); }
    return;
  }
  if(b.id === 'osSend'){
    const ref = SH.ref.trim(); SH.msg = ''; SH.ok = '';
    if(!ref && !SH.img && !(ORD.proof && ORD.proof.hasImage)){ SH.msg = 'اكتب رقم العملية أو ارفق صورة الإيصال.'; renderSheet(); return; }
    b.disabled = true;
    try{ const body = { orderId: ORD.id, ref }; if(SH.img) body.image = SH.img; const j = await apiAuth('/store/order/proof', body); ORD = j.order; SH.img = undefined; SH.ref = ''; SH.ok = 'وصلنا إيصالك ✅ رح نراجعه ونبلّغك.'; renderSheet(); loadMyOrders(); }
    catch(err){ SH.msg = err.message; renderSheet(); }
    return;
  }
  if(b.id === 'osCancel'){
    if(!window.confirm('تلغي ' + (ORD.kind === 'topup' ? 'الإيداع ' : 'الطلب ') + ORD.code + '؟')) return;
    try{ const j = await apiAuth('/store/order/cancel', { orderId: ORD.id }); ORD = j.order; stopTimer(); renderSheet(); loadMyOrders(); }
    catch(err){ SH.msg = err.message; renderSheet(); }
    return;
  }
  if(b.id === 'osRefresh'){ try{ await reloadOrder(); SH.msg = ''; SH.ok = 'تم التحديث.'; }catch(err){ SH.msg = err.message; } renderSheet(); }
});
$('drBody').addEventListener('click', e => {
  const r = e.target.closest('[data-oid]'); if(r){ openExisting(r.dataset.oid); return; }
  if(e.target.closest('#btnRefreshOrders')){ loadMyOrders(); refreshBalance(); return; }
  if(e.target.closest('#btnDrTopup')){ ordTriggerSel = '#btnMenu'; openTopup(); }
});
if(auth) auth.onAuthStateChanged(u => { USER = u; CUSTOMER = null; ACC_MSG = ''; ACC = 'idle'; PRICES = null; MY = []; MY_STATE = 'idle'; if(!$('osheet').hidden) closeSheet(); if(u) loadCustomer(); else { renderDrawer(); render(); renderWallet(); } });

</script>
</body>
</html>
