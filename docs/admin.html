<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة رموز الاسترداد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110D; --panel:#1F1B14; --panel2:#262117;
    --amber:#E3A83B; --steel:#5B7B99; --ember:#E4572E;
    --text:#EFE6D2; --dim:#948A72; --border:#332C1F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Cairo', sans-serif; padding:24px 16px 60px;
  }
  .wrap{max-width:420px; margin:0 auto;}
  h1{font-size:20px; text-align:center; color:#fff; margin:10px 0 24px;}
  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--border);
    border-radius:14px; padding:18px; margin-bottom:14px;
  }
  .btn{
    width:100%; border:none; border-radius:12px; padding:14px;
    font-family:'Cairo', sans-serif; font-weight:800; font-size:14px; cursor:pointer;
    background:linear-gradient(135deg, var(--ember), #ff8a5c); color:#210a02;
  }
  .btn:disabled{opacity:.5;}
  .field label{font-size:12px; color:var(--dim); display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:#00000030; border:1px solid var(--border); border-radius:10px;
    padding:11px; color:var(--text); font-family:'Cairo', sans-serif; font-size:14px; margin-bottom:14px;
  }
  .result{
    background:var(--panel2); border:1px dashed var(--amber); border-radius:10px;
    padding:14px; text-align:center; margin-top:14px; display:none;
  }
  .result.show{display:block;}
  .result .code{font-size:22px; font-weight:800; color:var(--amber); letter-spacing:2px; direction:ltr;}
  .result .pts{font-size:12px; color:var(--dim); margin-top:4px;}
  .copy-btn{
    margin-top:10px; background:var(--steel); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font-family:'Cairo', sans-serif; font-size:12px; font-weight:700; cursor:pointer;
  }
  .msg{text-align:center; font-size:12px; color:var(--dim); min-height:16px; margin-top:6px;}
  .gate{text-align:center; padding:40px 0;}
  .gate .btn{max-width:280px; margin:0 auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th, td{padding:8px 4px; text-align:right; border-bottom:1px solid var(--border);}
  th{color:var(--dim); font-weight:600;}
  .used-yes{color:var(--dim);}
  .used-no{color:var(--amber); font-weight:700;}

  .tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .tab{
    flex:1 1 45%; text-align:center; padding:10px 4px; border-radius:10px; font-size:12px; font-weight:800;
    background:var(--panel); border:1px solid var(--border); color:var(--dim); cursor:pointer;
  }
  .tab.active{background:var(--amber); color:#241a05; border-color:var(--amber);}

  .req-card{
    background:linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--border);
    border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .req-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .req-top .amt{font-size:16px; font-weight:800; color:#fff;}
  .req-top .method{font-size:11px; color:var(--amber); font-weight:700;}
  .req-who{font-size:12px; color:var(--dim); margin-bottom:8px;}
  .req-note{font-size:12px; color:var(--text); background:#00000030; border-radius:8px; padding:8px; margin-bottom:8px;}
  .req-img{width:100%; border-radius:10px; margin-bottom:10px; cursor:zoom-in; display:block;}
  .req-actions{display:flex; gap:8px;}
  .req-actions .btn{padding:11px; font-size:12.5px;}
  .btn-reject{background:var(--panel); color:var(--dim); border:1px solid var(--border);}
  .req-status{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:800;}
  .req-status.pending{background:#4a3a12; color:var(--amber);}
  .req-status.fulfilled{background:#123a1c; color:#5fd88a;}
  .req-status.rejected{background:#3a1212; color:#e06868;}
  .empty-note{text-align:center; color:var(--dim); font-size:13px; padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 إدارة رموز الاسترداد</h1>

  <div id="gate" class="gate">
    <button class="btn" id="btnLogin">تسجيل الدخول عبر Google</button>
    <div class="msg" id="gateMsg"></div>
  </div>

  <div id="panel" style="display:none;">
    <div class="tabs">
      <div class="tab active" id="tabRequests">📥 طلبات الشراء <span id="pendingBadge"></span></div>
      <div class="tab" id="tabWithdraws">📤 طلبات السحب <span id="wdPendingBadge"></span></div>
      <div class="tab" id="tabCodes">🔑 توليد كود</div>
      <div class="tab" id="tabSettings">⚙️ الإعدادات</div>
    </div>

    <div id="viewRequests">
      <div id="requestsList"></div>
    </div>

    <div id="viewWithdraws" style="display:none;">
      <div id="withdrawsList"></div>
    </div>

    <div id="viewSettings" style="display:none;">
      <div class="card">
        <div style="font-size:13px; color:var(--dim); margin-bottom:10px;">أسعار تُستخدم بحساب مبالغ الليرة السورية والحد الأدنى للسحب — حدّثها وقت ما تتغير الأسعار</div>
        <div class="field">
          <label>سعر صرف الدولار مقابل الليرة السورية (1$ = ؟ ل.س)</label>
          <input type="number" id="rateSyp" placeholder="مثال: 14500">
        </div>
        <div class="field">
          <label>سعر البيتكوين بالدولار (1 BTC = ؟$)</label>
          <input type="number" id="rateBtc" placeholder="مثال: 78224">
        </div>
        <div class="field">
          <label>سعر الإيثيريوم بالدولار (1 ETH = ؟$)</label>
          <input type="number" id="rateEth" placeholder="مثال: 2464">
        </div>
        <button class="btn" id="btnSaveRates">حفظ الأسعار</button>
        <div class="msg" id="ratesMsg"></div>
      </div>
    </div>

    <div id="viewCodes" style="display:none;">
    <div class="card">
      <div class="field">
        <label>عدد النقاط</label>
        <input type="number" id="pointsInput" placeholder="مثال: 2800" min="1">
      </div>
      <button class="btn" id="btnGenerate">توليد كود جديد</button>
      <div class="result" id="result">
        <div class="code" id="resultCode"></div>
        <div class="pts" id="resultPts"></div>
        <button class="copy-btn" id="btnCopy">نسخ الكود</button>
      </div>
      <div class="msg" id="genMsg"></div>
    </div>

    <div class="card">
      <div style="font-size:13px; color:var(--dim); margin-bottom:10px;">آخر 15 كود</div>
      <table>
        <thead><tr><th>الكود</th><th>نقاط</th><th>الحالة</th></tr></thead>
        <tbody id="codesTable"></tbody>
      </table>
    </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAP7sXXQeNCmdgwqUo6meC2Uv6_zM7jxwA",
  authDomain: "warehouse-tycoon-a3f83.firebaseapp.com",
  projectId: "warehouse-tycoon-a3f83",
  storageBucket: "warehouse-tycoon-a3f83.firebasestorage.app",
  messagingSenderId: "1054454384493",
  appId: "1:1054454384493:web:3003d8c766739e75e33c64",
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();

const ADMIN_UID = "09DZoXtB6afGTGHtFghiUx5t71N2";

const gate = document.getElementById('gate');
const panel = document.getElementById('panel');
const gateMsg = document.getElementById('gateMsg');

document.getElementById('btnLogin').onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(err => {
    gateMsg.textContent = 'تعذّر تسجيل الدخول: ' + err.message;
  });
};

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // بدون أحرف/أرقام ملتبسة
  let s = '';
  for(let i=0;i<8;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function loadRecentCodes(){
  const tbody = document.getElementById('codesTable');
  tbody.innerHTML = '<tr><td colspan="3">جاري التحميل...</td></tr>';
  try{
    const snap = await fbDb.collection('redeemCodes').orderBy('createdAt', 'desc').limit(15).get();
    if(snap.empty){ tbody.innerHTML = '<tr><td colspan="3">لا يوجد أكواد بعد</td></tr>'; return; }
    tbody.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const tr = document.createElement('tr');
      tr.innerHTML = `<td style="direction:ltr; text-align:left;">${doc.id}</td><td>${d.points ?? '-'}</td><td class="${d.used ? 'used-yes' : 'used-no'}">${d.used ? 'مستخدم' : 'متاح'}</td>`;
      tbody.appendChild(tr);
    });
  }catch(e){
    tbody.innerHTML = '<tr><td colspan="3">تعذّر التحميل</td></tr>';
    console.error(e);
  }
}

document.getElementById('btnGenerate').onclick = async () => {
  const pointsInput = document.getElementById('pointsInput');
  const genMsg = document.getElementById('genMsg');
  const points = parseInt(pointsInput.value, 10);
  if(!points || points <= 0){ genMsg.textContent = 'اكتب عدد نقاط صحيح أول.'; return; }

  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  genMsg.textContent = 'جاري التوليد...';

  const code = genCode();
  try{
    await fbDb.collection('redeemCodes').doc(code).set({
      points, used: false, createdAt: Date.now(), createdBy: fbAuth.currentUser.uid
    });
    document.getElementById('resultCode').textContent = code;
    document.getElementById('resultPts').textContent = `${points.toLocaleString('en-US')} نقطة`;
    document.getElementById('result').classList.add('show');
    genMsg.textContent = '✓ تم إنشاء الكود بنجاح';
    pointsInput.value = '';
    loadRecentCodes();
  }catch(e){
    genMsg.textContent = 'تعذّر إنشاء الكود: ' + e.message;
    console.error(e);
  }
  btn.disabled = false;
};

document.getElementById('btnCopy').onclick = () => {
  const code = document.getElementById('resultCode').textContent;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('genMsg').textContent = '✓ تم نسخ الكود';
  });
};

// ===== Tabs =====
const tabRequests = document.getElementById('tabRequests');
const tabWithdraws = document.getElementById('tabWithdraws');
const tabCodes = document.getElementById('tabCodes');
const tabSettings = document.getElementById('tabSettings');
const viewRequests = document.getElementById('viewRequests');
const viewWithdraws = document.getElementById('viewWithdraws');
const viewCodes = document.getElementById('viewCodes');
const viewSettings = document.getElementById('viewSettings');
const allTabs = [tabRequests, tabWithdraws, tabCodes, tabSettings];
const allViews = [viewRequests, viewWithdraws, viewCodes, viewSettings];
function activateTab(tab, view){
  allTabs.forEach(t => t.classList.toggle('active', t === tab));
  allViews.forEach(v => v.style.display = (v === view) ? 'block' : 'none');
}
tabRequests.onclick = () => activateTab(tabRequests, viewRequests);
tabWithdraws.onclick = () => activateTab(tabWithdraws, viewWithdraws);
tabCodes.onclick = () => activateTab(tabCodes, viewCodes);
tabSettings.onclick = () => activateTab(tabSettings, viewSettings);

// ===== Purchase requests =====
const METHOD_LABEL = {
  Kazawallet: 'Kazawallet',
  ShamCash_usd: 'ShamCash (دولار)', ShamCash_syp: 'ShamCash (ليرة سورية)',
  Syriatel: 'سرياتيل كاش / أقرب إليك',
  BinancePay: 'Binance Pay',
  USDT_BEP20: 'USDT (BEP20)', USDT_TRC20: 'USDT (TRC20)', USDT_ERC20: 'USDT (ERC20)',
};
let requestsUnsub = null;

function watchPurchaseRequests(){
  const list = document.getElementById('requestsList');
  if(requestsUnsub) requestsUnsub();
  requestsUnsub = fbDb.collection('purchaseRequests').orderBy('createdAt', 'desc').limit(40)
    .onSnapshot(snap => {
      if(snap.empty){ list.innerHTML = '<div class="empty-note">لا يوجد طلبات شراء بعد</div>'; updateBadge(0); return; }
      let pendingCount = 0;
      list.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        if(d.status === 'pending') pendingCount++;
        const statusLabel = d.status === 'fulfilled' ? '✓ أُرسل' : d.status === 'rejected' ? '✕ مرفوض' : '⏳ قيد المراجعة';
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <div class="req-top">
            <span class="amt">${(d.points ?? 0).toLocaleString('en-US')} نقطة <span style="color:var(--dim); font-size:12px;">(${d.amountDisplay || ('$' + (d.usd ?? '-'))})</span></span>
            <span class="req-status ${d.status}">${statusLabel}</span>
          </div>
          <div class="req-top"><span class="method">${METHOD_LABEL[d.method] || d.method || '-'}</span></div>
          <div class="req-who">${d.displayName || ''} ${d.email ? '· ' + d.email : ''}</div>
          ${d.note ? `<div class="req-note">${d.note}</div>` : ''}
          ${d.proofImage ? `<img class="req-img" src="${d.proofImage}" onclick="window.open(this.src)">` : ''}
          <div class="req-actions" ${d.status !== 'pending' ? 'style="display:none;"' : ''}>
            <button class="btn" data-act="fulfill" data-id="${doc.id}" data-uid="${d.uid}" data-points="${d.points}">✓ توليد كود وإرسال بالبريد</button>
            <button class="btn btn-reject" data-act="reject" data-id="${doc.id}">رفض</button>
          </div>
        `;
        list.appendChild(card);
      });
      updateBadge(pendingCount);
    }, err => {
      list.innerHTML = '<div class="empty-note">تعذّر تحميل الطلبات</div>';
      console.error(err);
    });
}
function updateBadge(n){
  const badge = document.getElementById('pendingBadge');
  badge.textContent = n > 0 ? n : '';
}

document.getElementById('requestsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  btn.disabled = true;
  const reqId = btn.dataset.id;
  if(btn.dataset.act === 'reject'){
    try{ await fbDb.collection('purchaseRequests').doc(reqId).update({ status: 'rejected', reviewedAt: Date.now(), reviewedBy: fbAuth.currentUser.uid }); }
    catch(err){ alert('تعذّر الرفض: ' + err.message); }
    btn.disabled = false;
    return;
  }
  if(btn.dataset.act === 'fulfill'){
    const uid = btn.dataset.uid;
    const points = parseInt(btn.dataset.points, 10);
    const code = genCode();
    try{
      await fbDb.collection('redeemCodes').doc(code).set({
        points, used: false, createdAt: Date.now(), createdBy: fbAuth.currentUser.uid
      });
      await fbDb.collection('mail').add({
        uid, points, code,
        message: `تم تأكيد شحنتك بـ ${points.toLocaleString('en-US')} نقطة! اضغط "استرداد" تحت لتفعيلها.`,
        createdAt: Date.now(), claimed: false, read: false,
      });
      await fbDb.collection('purchaseRequests').doc(reqId).update({
        status: 'fulfilled', fulfilledAt: Date.now(), fulfilledBy: fbAuth.currentUser.uid, generatedCode: code
      });
    }catch(err){
      alert('تعذّر إتمام الطلب: ' + err.message);
      btn.disabled = false;
    }
  }
});

// ===== طلبات السحب =====
let withdrawsUnsub = null;
function watchWithdrawRequests(){
  const list = document.getElementById('withdrawsList');
  if(withdrawsUnsub) withdrawsUnsub();
  withdrawsUnsub = fbDb.collection('withdrawRequests').orderBy('createdAt', 'desc').limit(40)
    .onSnapshot(snap => {
      if(snap.empty){ list.innerHTML = '<div class="empty-note">لا يوجد طلبات سحب بعد</div>'; updateWdBadge(0); return; }
      let pendingCount = 0;
      list.innerHTML = '';
      snap.forEach(doc => {
        const d = doc.data();
        if(d.status === 'pending') pendingCount++;
        const statusLabel = d.status === 'fulfilled' ? '✓ أُرسل' : d.status === 'rejected' ? '✕ مرفوض (استرجع الرصيد)' : '⏳ قيد المراجعة';
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <div class="req-top">
            <span class="amt">${d.amount.toFixed(8)} ${d.coin.toUpperCase()}</span>
            <span class="req-status ${d.status}">${statusLabel}</span>
          </div>
          <div class="req-who">${d.displayName || ''} ${d.email ? '· ' + d.email : ''}</div>
          <div class="req-note" style="direction:ltr; text-align:right; word-break:break-all;">${d.walletAddress || ''}</div>
          <div class="req-actions" ${d.status !== 'pending' ? 'style="display:none;"' : ''}>
            <button class="btn" data-wdact="fulfill" data-id="${doc.id}">✓ تم الإرسال يدوياً</button>
            <button class="btn btn-reject" data-wdact="reject" data-id="${doc.id}" data-uid="${d.uid}" data-coin="${d.coin}" data-amount="${d.amount}">رفض وإرجاع الرصيد</button>
          </div>
        `;
        list.appendChild(card);
      });
      updateWdBadge(pendingCount);
    }, err => {
      list.innerHTML = '<div class="empty-note">تعذّر تحميل طلبات السحب</div>';
      console.error(err);
    });
}
function updateWdBadge(n){
  document.getElementById('wdPendingBadge').textContent = n > 0 ? n : '';
}
document.getElementById('withdrawsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-wdact]');
  if(!btn) return;
  btn.disabled = true;
  const reqId = btn.dataset.id;
  if(btn.dataset.wdact === 'fulfill'){
    try{ await fbDb.collection('withdrawRequests').doc(reqId).update({ status: 'fulfilled', reviewedAt: Date.now(), reviewedBy: fbAuth.currentUser.uid }); }
    catch(err){ alert('تعذّر التأكيد: ' + err.message); btn.disabled = false; }
    return;
  }
  if(btn.dataset.wdact === 'reject'){
    const uid = btn.dataset.uid, coin = btn.dataset.coin, amount = parseFloat(btn.dataset.amount);
    try{
      await fbDb.collection('players').doc(uid).update({
        [`wallet.${coin}`]: firebase.firestore.FieldValue.increment(amount)
      });
      await fbDb.collection('withdrawRequests').doc(reqId).update({ status: 'rejected', reviewedAt: Date.now(), reviewedBy: fbAuth.currentUser.uid });
    }catch(err){ alert('تعذّر الرفض: ' + err.message); btn.disabled = false; }
  }
});

// ===== إعدادات الأسعار =====
async function loadRates(){
  try{
    const doc = await fbDb.collection('config').doc('pricing').get();
    if(doc.exists){
      const d = doc.data();
      document.getElementById('rateSyp').value = d.usdToSyp || '';
      document.getElementById('rateBtc').value = d.btcUsd || '';
      document.getElementById('rateEth').value = d.ethUsd || '';
    }
  }catch(e){ console.error('load rates failed', e); }
}
document.getElementById('btnSaveRates').onclick = async () => {
  const ratesMsg = document.getElementById('ratesMsg');
  const usdToSyp = parseFloat(document.getElementById('rateSyp').value) || 0;
  const btcUsd = parseFloat(document.getElementById('rateBtc').value) || 0;
  const ethUsd = parseFloat(document.getElementById('rateEth').value) || 0;
  try{
    await fbDb.collection('config').doc('pricing').set({
      usdToSyp, btcUsd, ethUsd, updatedAt: Date.now(), updatedBy: fbAuth.currentUser.uid
    });
    ratesMsg.style.color = '#5fd88a';
    ratesMsg.textContent = '✓ تم الحفظ';
  }catch(e){
    ratesMsg.style.color = 'var(--ember)';
    ratesMsg.textContent = 'تعذّر الحفظ: ' + e.message;
  }
};


fbAuth.onAuthStateChanged(user => {
  if(user && user.uid === ADMIN_UID){
    gate.style.display = 'none';
    panel.style.display = 'block';
    loadRecentCodes();
    watchPurchaseRequests();
    watchWithdrawRequests();
    loadRates();
  } else if(user){
    gate.style.display = 'block';
    panel.style.display = 'none';
    gateMsg.textContent = 'هذا الحساب غير مصرّح له بالدخول.';
    fbAuth.signOut();
  } else {
    gate.style.display = 'block';
    panel.style.display = 'none';
  }
});
</script>
</body>
</html>
