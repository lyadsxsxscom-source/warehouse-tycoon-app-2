<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة أكواد الشحن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110D; --panel:#1F1B14; --panel2:#262117;
    --amber:#E3A83B; --ember:#E4572E;
    --text:#EFE6D2; --dim:#948A72; --border:#332C1F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Cairo', sans-serif; padding:20px;
  }
  .wrap{max-width:420px; margin:40px auto;}
  h1{font-size:20px; color:#fff; text-align:center; margin-bottom:24px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:14px;
  }
  .field{margin-bottom:14px;}
  .field label{font-size:12px; color:var(--dim); display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:#00000030; border:1px solid var(--border); border-radius:10px;
    padding:12px; color:var(--text); font-family:'Cairo', sans-serif; font-size:14px;
  }
  .row{display:flex; gap:8px;}
  .row .field{flex:1;}
  button{
    width:100%; border:none; border-radius:10px; padding:13px;
    font-family:'Cairo', sans-serif; font-weight:800; font-size:14px; cursor:pointer;
  }
  .btn-main{background:linear-gradient(135deg, var(--ember), #ff8a5c); color:#210a02;}
  .btn-sub{background:var(--panel2); color:var(--text); border:1px solid var(--border); margin-top:8px;}
  .msg{text-align:center; font-size:12.5px; margin-top:10px; min-height:16px;}
  .msg.ok{color:var(--amber);}
  .msg.err{color:#ff8a5c;}
  #loginBox{text-align:center;}
  #loginBox button{background:linear-gradient(135deg, #4285F4, #34A853); color:#fff;}
  .hidden{display:none;}
  .list-item{
    display:flex; justify-content:space-between; font-size:12.5px;
    padding:8px 0; border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .code{font-family:monospace; color:var(--amber);}
</style>
</head>
<body>

<div class="wrap">
  <h1>📦 إدارة أكواد الشحن</h1>

  <div class="card" id="loginBox">
    <p style="color:var(--dim); font-size:13px;">سجّل دخولك للمتابعة</p>
    <button id="btnLogin">تسجيل الدخول عبر Google</button>
  </div>

  <div id="adminBox" class="hidden">
    <div class="card">
      <div class="field">
        <label>الكود (اضغط توليد أو اكتب يدوياً)</label>
        <div class="row">
          <input type="text" id="codeInput" placeholder="مثال: GAME-2800-X9K2" style="text-transform:uppercase;">
        </div>
        <button class="btn-sub" id="btnGenerate">🎲 توليد كود عشوائي</button>
      </div>
      <div class="field">
        <label>قيمة الكود بالنقاط</label>
        <input type="number" id="pointsInput" placeholder="مثال: 2800">
      </div>
      <button class="btn-main" id="btnCreate">إنشاء الكود</button>
      <div class="msg" id="createMsg"></div>
    </div>

    <div class="card">
      <p style="color:var(--dim); font-size:12.5px; margin:0 0 10px;">آخر الأكواد المُنشأة (هالجلسة فقط)</p>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAP7sXXQeNCmdgwqUo6meC2Uv6_zM7jxwA",
  authDomain: "warehouse-tycoon-a3f83.firebaseapp.com",
  projectId: "warehouse-tycoon-a3f83",
  storageBucket: "warehouse-tycoon-a3f83.firebasestorage.app",
  messagingSenderId: "1054454384493",
  appId: "1:1054454384493:web:3003d8c766739e75e33c64",
  measurementId: "G-HPXL5HHFNL"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.firestore();

const ADMIN_UID = '09DZoXtB6afGTGHtFghiUx5t71N2';

const loginBox = document.getElementById('loginBox');
const adminBox = document.getElementById('adminBox');
const codeInput = document.getElementById('codeInput');
const pointsInput = document.getElementById('pointsInput');
const createMsg = document.getElementById('createMsg');
const recentList = document.getElementById('recentList');

document.getElementById('btnLogin').onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(err => alert('تعذّر تسجيل الدخول: ' + err.message));
};

fbAuth.onAuthStateChanged(user => {
  if(user && user.uid === ADMIN_UID){
    loginBox.classList.add('hidden');
    adminBox.classList.remove('hidden');
  } else if(user){
    loginBox.classList.remove('hidden');
    adminBox.classList.add('hidden');
    loginBox.innerHTML = '<p style="color:#ff8a5c; font-size:13px;">هذا الحساب غير مخوّل بالوصول لهذه الصفحة.</p>';
    fbAuth.signOut();
  } else {
    loginBox.classList.remove('hidden');
    adminBox.classList.add('hidden');
  }
});

function randomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let part = '';
  for(let i=0;i<8;i++){ part += chars[Math.floor(Math.random()*chars.length)]; }
  return 'GAME-' + part;
}

document.getElementById('btnGenerate').onclick = () => {
  codeInput.value = randomCode();
};

document.getElementById('btnCreate').onclick = async () => {
  const code = codeInput.value.trim().toUpperCase();
  const points = parseInt(pointsInput.value, 10);
  createMsg.className = 'msg';
  if(!code){ createMsg.textContent = 'اكتب أو ولّد كود أولاً.'; createMsg.classList.add('err'); return; }
  if(!points || points <= 0){ createMsg.textContent = 'حدد قيمة نقاط صحيحة.'; createMsg.classList.add('err'); return; }

  try{
    const ref = fbDb.collection('redeemCodes').doc(code);
    const existing = await ref.get();
    if(existing.exists){ createMsg.textContent = 'هذا الكود موجود مسبقاً، جرّب توليد كود جديد.'; createMsg.classList.add('err'); return; }

    await ref.set({ points, used: false, createdAt: Date.now() });
    createMsg.textContent = `✓ تم إنشاء الكود ${code} بقيمة ${points} نقطة`;
    createMsg.classList.add('ok');

    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `<span class="code">${code}</span><span>${points} نقطة</span>`;
    recentList.prepend(item);

    codeInput.value = '';
    pointsInput.value = '';
  }catch(e){
    createMsg.textContent = 'فشل الإنشاء: ' + e.message;
    createMsg.classList.add('err');
  }
};
</script>
</body>
</html>
