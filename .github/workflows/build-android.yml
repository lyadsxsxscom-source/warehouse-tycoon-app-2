name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate app icon & splash screen
        run: npx @capacitor/assets generate --android

      - name: Setup Google Sign-In (google-services + stable keystore)
        run: |
          chmod +x setup-android.sh
          ./setup-android.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-tycoon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Patch build.gradle for release signing
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          sed -i '/^android {/a\    signingConfigs {\n        release {\n            storeFile file(System.getenv("RELEASE_KEYSTORE_PATH"))\n            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("RELEASE_KEY_ALIAS")\n            keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")\n        }\n    }' android/app/build.gradle
          sed -i '/proguardFiles getDefaultProguardFile/a\            signingConfig signingConfigs.release' android/app/build.gradle

      - name: Build signed release AAB
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew bundleRelease

      - name: Upload signed release AAB
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-tycoon-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
