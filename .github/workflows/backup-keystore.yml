name: Backup keystore (encrypted)

# يشتغل بس لما تضغط Run workflow يدوياً. بيطلّع نسخة احتياطية من مفتاح التوقيع مشفّرة بكلمة سر بتحطها إنت
# (السر KEYSTORE_BACKUP_PASSPHRASE)، وبتنزّلها من صفحة التشغيل (Artifacts) وبتنحذف تلقائياً بعد يوم.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the passphrase secret exists
        env:
          PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo "::error::ضيف السر KEYSTORE_BACKUP_PASSPHRASE أول (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ ${#PASS} -lt 16 ]; then echo "::error::كلمة السر قصيرة. استخدم 16 حرف أو أكتر (الأفضل 25+)"; exit 1; fi

      - name: Build the encrypted backup
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
        run: |
          set +x
          mkdir -p work out
          echo "$KS_B64" | base64 -d > work/release.keystore
          printf 'keystore password: %s\nkey alias: %s\nkey password: (same as keystore password)\n' "$KS_PASS" "$KS_ALIAS" > work/credentials.txt
          keytool -list -v -keystore work/release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null | grep -E "SHA1:|SHA256:" | sed 's/^ *//' >> work/credentials.txt
          tar -C work -czf work/bundle.tar.gz release.keystore credentials.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:PASS -in work/bundle.tar.gz -out out/yardova-keystore-backup.enc
          # تحقق إنه النسخة بتنفتح فعلاً وبتطلع نفس المفتاح
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:PASS -in out/yardova-keystore-backup.enc -out work/check.tar.gz
          mkdir work/check && tar -C work/check -xzf work/check.tar.gz
          cmp work/release.keystore work/check/release.keystore
          keytool -list -keystore work/check/release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1
          echo "::notice title=Backup verified::النسخة المشفّرة بتنفتح وبتطلع نفس المفتاح. SHA-256 للملف المشفّر: $(sha256sum out/yardova-keystore-backup.enc | cut -d' ' -f1)"
          cp tools/KEYSTORE-RESTORE.md out/RESTORE.md

      - name: Upload (deleted automatically after 1 day)
        uses: actions/upload-artifact@v6
        with:
          name: yardova-keystore-backup-ENCRYPTED
          path: out/
          retention-days: 1
